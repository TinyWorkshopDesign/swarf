name: release

# Push a tag such as v0.2.0 to build installers for every platform and architecture
# and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test --release
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: Universal .dmg and .zip
        run: |
          lipo -create -output target/release/swarf-universal \
            target/aarch64-apple-darwin/release/swarf target/x86_64-apple-darwin/release/swarf
          BIN=target/release/swarf-universal ./scripts/bundle_macos.sh
          hdiutil create -volname "Swarf" -srcfolder target/release/Swarf.app -ov -format UDZO \
            "Swarf-${GITHUB_REF_NAME}-macos.dmg"
          ditto -c -k --keepParent target/release/Swarf.app "Swarf-${GITHUB_REF_NAME}-macos.zip"
      - name: Per-architecture .dmg and .zip
        run: |
          build_arch() {
            label="$1"; target="$2"
            BIN="target/$target/release/swarf" ./scripts/bundle_macos.sh
            hdiutil create -volname "Swarf" -srcfolder target/release/Swarf.app -ov -format UDZO \
              "Swarf-${GITHUB_REF_NAME}-macos-${label}.dmg"
            ditto -c -k --keepParent target/release/Swarf.app "Swarf-${GITHUB_REF_NAME}-macos-${label}.zip"
          }
          build_arch arm64 aarch64-apple-darwin
          build_arch x86_64 x86_64-apple-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            Swarf-*-macos.dmg
            Swarf-*-macos-arm64.dmg
            Swarf-*-macos-x86_64.dmg
            Swarf-*-macos.zip
            Swarf-*-macos-arm64.zip
            Swarf-*-macos-x86_64.zip

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: x64
          - runner: windows-11-arm
            label: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path target/release/swarf.exe, LICENSE, README.md -DestinationPath "Swarf-$env:GITHUB_REF_NAME-windows-${{ matrix.label }}.zip"
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Installer (.exe)
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = (Get-Command makensis).Source }
          & $makensis /DVERSION=$env:GITHUB_REF_NAME /DARCH=${{ matrix.label }} /DROOT=$env:GITHUB_WORKSPACE "scripts\installer.nsi"
          if (-not (Test-Path "Swarf-$env:GITHUB_REF_NAME-windows-${{ matrix.label }}-setup.exe")) { throw "installer not built" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.label }}
          path: |
            Swarf-*-windows-${{ matrix.label }}.zip
            Swarf-*-windows-${{ matrix.label }}-setup.exe

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: x64
            deb_arch: amd64
            appimage_tool: appimagetool-x86_64.AppImage
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            label: arm64
            deb_arch: arm64
            appimage_tool: appimagetool-aarch64.AppImage
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - run: cargo test --release
      - run: cargo build --release
      - name: Portable tarball
        run: |
          DIR="Swarf-${GITHUB_REF_NAME}-linux-${{ matrix.label }}"
          mkdir "$DIR"
          cp target/release/swarf assets/swarf.desktop LICENSE README.md "$DIR/"
          cp assets/icon-256.png "$DIR/swarf.png"
          tar -czf "$DIR.tar.gz" "$DIR"
      - name: Debian package (.deb)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          ROOT="$PWD/debbuild"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/icons/hicolor/256x256/apps" "$ROOT/usr/share/doc/swarf"
          install -m 0755 target/release/swarf "$ROOT/usr/bin/swarf"
          install -m 0644 assets/swarf.desktop "$ROOT/usr/share/applications/swarf.desktop"
          install -m 0644 assets/icon-256.png "$ROOT/usr/share/icons/hicolor/256x256/apps/swarf.png"
          install -m 0644 LICENSE README.md "$ROOT/usr/share/doc/swarf/"
          SIZE=$(du -sk "$ROOT/usr" | cut -f1)
          printf '%s\n' \
            'Package: swarf' \
            "Version: $VER" \
            'Section: science' \
            'Priority: optional' \
            "Architecture: ${{ matrix.deb_arch }}" \
            "Installed-Size: $SIZE" \
            'Maintainer: Michele Belleri' \
            'Description: Speeds and feeds calculator for CNC milling and drilling' \
            > "$ROOT/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$ROOT" "Swarf-${GITHUB_REF_NAME}-linux-${{ matrix.label }}.deb"
      - name: RPM package (.rpm)
        run: |
          sudo apt-get install -y rpm
          VER="${GITHUB_REF_NAME#v}"
          TOP="$PWD/rpmbuild"
          mkdir -p "$TOP/BUILD" "$TOP/RPMS" "$TOP/SOURCES" "$TOP/SPECS" "$TOP/SRPMS"
          install -m 0755 target/release/swarf "$TOP/SOURCES/swarf"
          install -m 0644 assets/swarf.desktop "$TOP/SOURCES/swarf.desktop"
          install -m 0644 assets/icon-256.png "$TOP/SOURCES/icon-256.png"
          cat > "$TOP/SPECS/swarf.spec" <<SPEC
          Name:           swarf
          Version:        $VER
          Release:        1
          Summary:        Speeds and feeds calculator for CNC milling and drilling
          License:        GPL-3.0-or-later
          URL:            https://github.com/TinyWorkshopDesign/swarf

          %description
          Swarf is a speeds and feeds calculator for CNC milling and drilling. It
          computes spindle speed and feed for end mills, face mills and drills in
          25 materials, and warns about tool deflection, spindle power and chip
          thinning.

          %install
          mkdir -p %{buildroot}%{_bindir}
          mkdir -p %{buildroot}%{_datadir}/applications
          mkdir -p %{buildroot}%{_datadir}/icons/hicolor/256x256/apps
          install -m 0755 %{_sourcedir}/swarf %{buildroot}%{_bindir}/swarf
          install -m 0644 %{_sourcedir}/swarf.desktop %{buildroot}%{_datadir}/applications/swarf.desktop
          install -m 0644 %{_sourcedir}/icon-256.png %{buildroot}%{_datadir}/icons/hicolor/256x256/apps/swarf.png

          %files
          %{_bindir}/swarf
          %{_datadir}/applications/swarf.desktop
          %{_datadir}/icons/hicolor/256x256/apps/swarf.png
          SPEC
          rpmbuild -bb --define "_topdir $TOP" "$TOP/SPECS/swarf.spec"
          cp "$TOP"/RPMS/*/*.rpm "Swarf-${GITHUB_REF_NAME}-linux-${{ matrix.label }}.rpm"
      - name: AppImage
        run: |
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          install -m 0755 target/release/swarf "$APPDIR/usr/bin/swarf"
          install -m 0644 assets/icon-256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/swarf.png"
          install -m 0644 assets/icon-256.png "$APPDIR/swarf.png"
          cp assets/swarf.desktop "$APPDIR/swarf.desktop"
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/usr/bin/swarf" "$@"' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/${{ matrix.appimage_tool }}" -O appimagetool
          chmod +x appimagetool
          ARCH=${{ matrix.appimage_arch }} ./appimagetool --appimage-extract-and-run "$APPDIR" "Swarf-${GITHUB_REF_NAME}-linux-${{ matrix.label }}.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.label }}
          path: |
            Swarf-*-linux-${{ matrix.label }}.tar.gz
            Swarf-*-linux-${{ matrix.label }}.deb
            Swarf-*-linux-${{ matrix.label }}.rpm
            Swarf-*-linux-${{ matrix.label }}.AppImage

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: Swarf-*
          generate_release_notes: true