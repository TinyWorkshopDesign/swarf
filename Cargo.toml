[package]
name = "swarf"
version = "0.3.0"
edition = "2024"
description = "Speeds and feeds calculator for CNC milling and drilling"
license = "GPL-3.0-or-later"
authors = ["Michele Belleri"]
repository = "https://github.com/TinyWorkshopDesign/swarf"
readme = "README.md"
keywords = ["cnc", "machining", "milling", "feeds-and-speeds", "egui"]
categories = ["science", "gui"]
rust-version = "1.95"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_plot = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
